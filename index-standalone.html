<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survivor.js - 倖存者戰士</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container { position: relative; }
        canvas { display: block; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">載入中...</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script>
// ==================== GAME CONSTANTS ====================
const GAME_CONSTANTS = {
    PLAYER: {
        HP: 100, SPEED: 200, PICKUP_RANGE: 80, ATTACK_RANGE: 300,
        FIRE_RATE: 500, DAMAGE: 1, PROJECTILE_SPEED: 400,
        PROJECTILE_COUNT: 3, INVINCIBLE_TIME: 1000
    },
    ENEMY: {
        NORMAL: { hp: 1, speed: { min: 50, max: 70 }, damage: 10, exp: 10, radius: 15 },
        FAST: { hp: 1, speed: { min: 90, max: 110 }, damage: 8, exp: 12, radius: 12 },
        TANK: { hp: 3, speed: { min: 25, max: 45 }, damage: 20, exp: 25, radius: 22 },
        RANGED: { hp: 2, speed: { min: 30, max: 50 }, damage: 10, exp: 15, radius: 14, shootInterval: 2000 },
        BOSS: { hp: 50, speed: 25, damage: 30, exp: 100, radius: 35, shootInterval: 1500 }
    },
    WAVE: {
        DURATION: 60000, REST_TIME: 5000, BASE_SPAWN_INTERVAL: 1500,
        MIN_SPAWN_INTERVAL: 300, HP_INCREASE_WAVE: 3, HP_MULTIPLIER: 1.5, BOSS_WAVE_INTERVAL: 5
    },
    TALENTS: [
        { id: 'hp', name: '生命強化', desc: '最大生命值 +20', icon: '❤️', effect: { hp: 20 } },
        { id: 'speed', name: '疾風步', desc: '移動速度 +30', icon: '💨', effect: { speed: 30 } },
        { id: 'pickup', name: '磁力手套', desc: '拾取範圍 +30', icon: '🧲', effect: { pickupRange: 30 } },
        { id: 'range', name: '鷹眼', desc: '攻擊範圍 +50', icon: '👁️', effect: { attackRange: 50 } },
        { id: 'fireRate', name: '急速射擊', desc: '射擊間隔 -0.08秒', icon: '⚡', effect: { fireRate: -80 } },
        { id: 'damage', name: '魔力增幅', desc: '傷害 +1', icon: '✨', effect: { damage: 1 } },
        { id: 'projSpeed', name: '子彈加速', desc: '子彈速度 +100', icon: '🚀', effect: { projectileSpeed: 100 } },
        { id: 'multiShot', name: '多重射擊', desc: '同時發射 +1 顆子彈', icon: '🎯', effect: { projectileCount: 1 } }
    ],
    CHAIN_KILL: { RANGE: 40, BUFF_DURATION: 5000, ATTACK_SPEED_BONUS: 0.7 },
    EXP_TO_LEVEL: (level) => level * 20
};

// ==================== BOOT SCENE ====================
class BootScene extends Phaser.Scene {
    constructor() { super({ key: 'BootScene' }); }
    create() {
        document.getElementById('loading').style.display = 'none';
        this.scene.start('GameScene');
        this.scene.start('UIScene');
    }
}

// ==================== GAME SCENE ====================
class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }

    init() {
        this.gameTime = 0;
        this.isPaused = false;
        this.isGameOver = false;
        this.isLevelUp = false;
        this.stats = { level: 1, exp: 0, kills: 0, bossKills: 0, wave: 1 };
        this.waveTimer = 0;
        this.isRestTime = false;
        this.spawnTimer = 0;
        this.bossSpawned = false;
        this.hpMultiplier = 1;
        this.hasChainKillBuff = false;
        this.chainKillBuffTimer = 0;
    }

    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;

        this.createBackground(width, height);
        this.enemies = this.add.group();
        this.projectiles = this.add.group();
        this.enemyProjectiles = this.add.group();
        this.expOrbs = this.add.group();

        this.createPlayer(width, height);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });

        this.input.keyboard.on('keydown-ESC', () => this.togglePause());
        this.input.keyboard.on('keydown-P', () => this.togglePause());

        this.uiScene = this.scene.get('UIScene');
        this.initAudio();
    }

    createBackground(w, h) {
        const bg = this.add.graphics();
        bg.fillStyle(0x2d3436, 1);
        bg.fillRect(0, 0, w, h);
        bg.lineStyle(1, 0x3d4446, 0.3);
        for (let x = 0; x < w; x += 50) { bg.moveTo(x, 0); bg.lineTo(x, h); }
        for (let y = 0; y < h; y += 50) { bg.moveTo(0, y); bg.lineTo(w, y); }
        bg.strokePath();

        for (let i = 0; i < 30; i++) {
            const x = Phaser.Math.Between(20, w - 20);
            const y = Phaser.Math.Between(20, h - 20);
            const g = this.add.graphics();
            g.setAlpha(Phaser.Math.FloatBetween(0.3, 0.5));
            if (i % 3 === 0) {
                g.fillStyle(0x636e72, 1);
                g.fillEllipse(x, y, 10, 8);
            } else if (i % 3 === 1) {
                g.fillStyle(0x27ae60, 1);
                g.fillTriangle(x, y, x - 3, y - 10, x + 3, y - 10);
            } else {
                g.fillStyle(0x1e8449, 1);
                g.fillCircle(x, y, 5);
            }
        }
    }

    createPlayer(w, h) {
        this.player = this.add.container(w / 2, h / 2);
        Object.assign(this.player, {
            hp: GAME_CONSTANTS.PLAYER.HP,
            maxHp: GAME_CONSTANTS.PLAYER.HP,
            speed: GAME_CONSTANTS.PLAYER.SPEED,
            pickupRange: GAME_CONSTANTS.PLAYER.PICKUP_RANGE,
            attackRange: GAME_CONSTANTS.PLAYER.ATTACK_RANGE,
            fireRate: GAME_CONSTANTS.PLAYER.FIRE_RATE,
            damage: GAME_CONSTANTS.PLAYER.DAMAGE,
            projectileSpeed: GAME_CONSTANTS.PLAYER.PROJECTILE_SPEED,
            projectileCount: GAME_CONSTANTS.PLAYER.PROJECTILE_COUNT,
            fireCooldown: 0,
            isInvincible: false,
            invincibleTimer: 0,
            vx: 0, vy: 0,
            isSwinging: false, swingTimer: 0
        });

        this.attackRangeGraphics = this.add.graphics();
        this.playerBody = this.add.graphics();
        this.drawPlayerBody();
        this.player.add(this.playerBody);

        this.swordGraphics = this.add.graphics();
        this.player.add(this.swordGraphics);
        this.drawSword(0);
    }

    drawPlayerBody() {
        const g = this.playerBody;
        g.clear();
        // Body
        g.fillStyle(0x95a5a6, 1);
        g.fillRoundedRect(-12, -8, 24, 28, 4);
        g.fillStyle(0x7f8c8d, 1);
        g.fillRoundedRect(-10, -6, 20, 24, 3);
        // Helmet
        g.fillStyle(0xbdc3c7, 1);
        g.fillCircle(0, -12, 14);
        g.fillStyle(0x95a5a6, 1);
        g.fillCircle(0, -12, 11);
        g.fillStyle(0x2c3e50, 1);
        g.fillRect(-6, -14, 12, 4);
        // Gauntlets
        g.fillStyle(0xf1c40f, 1);
        g.fillRoundedRect(-16, 8, 8, 12, 2);
        g.fillRoundedRect(8, 8, 8, 12, 2);
    }

    drawSword(angle) {
        const g = this.swordGraphics;
        g.clear();
        const cos = Math.cos(angle - Math.PI/4);
        const sin = Math.sin(angle - Math.PI/4);
        const rx = (px, py) => 12 + px * cos - py * sin;
        const ry = (px, py) => 10 + px * sin + py * cos;

        // Blade
        g.fillStyle(0x3498db, 1);
        g.beginPath();
        g.moveTo(rx(-2, -35), ry(-2, -35));
        g.lineTo(rx(2, -35), ry(2, -35));
        g.lineTo(rx(2, 0), ry(2, 0));
        g.lineTo(rx(-2, 0), ry(-2, 0));
        g.closePath();
        g.fillPath();

        // Hilt
        g.fillStyle(0xf1c40f, 1);
        g.fillRect(rx(-3, 0) - 1, ry(-3, 0) - 1, 6, 8);

        if (this.player && this.player.isSwinging) {
            g.fillStyle(0xffffff, 0.8);
            g.fillCircle(rx(0, -36), ry(0, -36), 4);
        }
    }

    initAudio() {
        this.audioContext = null;
        this.masterVolume = 0.5;
        this.sfxVolume = 0.7;
        this.bgmOscillator = null;

        const startAudio = () => {
            if (!this.audioContext) {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.startBGM();
            }
        };
        this.input.once('pointerdown', startAudio);
        this.input.keyboard.once('keydown', startAudio);
    }

    playSound(type) {
        if (!this.audioContext) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        osc.connect(gain);
        gain.connect(this.audioContext.destination);
        const vol = this.masterVolume * this.sfxVolume;
        const now = this.audioContext.currentTime;

        switch(type) {
            case 'swing': osc.type = 'square'; osc.frequency.setValueAtTime(200, now); gain.gain.setValueAtTime(vol * 0.3, now); osc.start(); osc.stop(now + 0.15); break;
            case 'hit': osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.start(); osc.stop(now + 0.1); break;
            case 'kill': osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.3); osc.start(); osc.stop(now + 0.3); break;
            case 'chainKill': osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now); osc.frequency.exponentialRampToValueAtTime(1500, now + 0.5); osc.start(); osc.stop(now + 0.5); break;
            case 'levelUp': osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1800, now + 0.8); osc.start(); osc.stop(now + 0.8); break;
            case 'damage': osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.start(); osc.stop(now + 0.2); break;
            case 'pickup': osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.start(); osc.stop(now + 0.1); break;
            case 'gameOver': osc.type = 'sine'; osc.frequency.setValueAtTime(100, now); osc.start(); osc.stop(now + 1.0); break;
        }
    }

    startBGM() {
        if (!this.audioContext || this.bgmOscillator) return;
        this.bgmOscillator = this.audioContext.createOscillator();
        const lfo = this.audioContext.createOscillator();
        const lfoGain = this.audioContext.createGain();
        const gain = this.audioContext.createGain();
        this.bgmOscillator.type = 'triangle';
        this.bgmOscillator.frequency.setValueAtTime(80, this.audioContext.currentTime);
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(0.5, this.audioContext.currentTime);
        lfoGain.gain.setValueAtTime(20, this.audioContext.currentTime);
        lfo.connect(lfoGain);
        lfoGain.connect(this.bgmOscillator.frequency);
        gain.gain.setValueAtTime(this.masterVolume * 0.3 * 0.1, this.audioContext.currentTime);
        this.bgmOscillator.connect(gain);
        gain.connect(this.audioContext.destination);
        lfo.start();
        this.bgmOscillator.start();
    }

    stopBGM() {
        if (this.bgmOscillator) { this.bgmOscillator.stop(); this.bgmOscillator = null; }
    }

    update(time, delta) {
        if (this.isPaused || this.isGameOver || this.isLevelUp) return;
        this.gameTime += delta;
        this.waveTimer += delta;

        this.handleInput();
        this.updatePlayer(delta);
        this.updateEnemies(delta);
        this.updateProjectiles(delta);
        this.handleWaveSystem(delta);
        this.handleAutoFire(delta);
        this.handleCollisions();
        this.handleChainKill(delta);
        this.updateUI();
        this.updateAttackRangeGraphics();
    }

    handleInput() {
        let vx = 0, vy = 0;
        if (this.cursors.left.isDown || this.wasd.left.isDown) vx = -1;
        else if (this.cursors.right.isDown || this.wasd.right.isDown) vx = 1;
        if (this.cursors.up.isDown || this.wasd.up.isDown) vy = -1;
        else if (this.cursors.down.isDown || this.wasd.down.isDown) vy = 1;
        if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }
        this.player.vx = vx;
        this.player.vy = vy;
    }

    updatePlayer(delta) {
        const dt = delta / 1000;
        this.player.x += this.player.vx * this.player.speed * dt;
        this.player.y += this.player.vy * this.player.speed * dt;
        this.player.x = Phaser.Math.Clamp(this.player.x, 20, this.cameras.main.width - 20);
        this.player.y = Phaser.Math.Clamp(this.player.y, 20, this.cameras.main.height - 20);

        if (this.player.fireCooldown > 0) {
            let cd = this.player.fireCooldown - delta;
            if (this.hasChainKillBuff) cd -= delta * (1 - GAME_CONSTANTS.CHAIN_KILL.ATTACK_SPEED_BONUS);
            this.player.fireCooldown = Math.max(0, cd);
        }

        if (this.player.isInvincible) {
            this.player.invincibleTimer -= delta;
            if (this.player.invincibleTimer <= 0) { this.player.isInvincible = false; this.player.setAlpha(1); }
        }

        if (this.player.isSwinging) {
            this.player.swingTimer -= delta;
            const progress = 1 - (this.player.swingTimer / 150);
            this.drawSword(progress * Math.PI / 2);
            if (this.player.swingTimer <= 0) { this.player.isSwinging = false; this.drawSword(0); }
        }
    }

    updateAttackRangeGraphics() {
        this.attackRangeGraphics.clear();
        this.attackRangeGraphics.lineStyle(2, 0x3498db, 0.3);
        this.attackRangeGraphics.strokeCircle(this.player.x, this.player.y, GAME_CONSTANTS.PLAYER.ATTACK_RANGE);
        if (this.player.attackRange > GAME_CONSTANTS.PLAYER.ATTACK_RANGE) {
            this.attackRangeGraphics.lineStyle(2, 0x2ecc71, 0.3);
            this.attackRangeGraphics.strokeCircle(this.player.x, this.player.y, this.player.attackRange);
        }
        this.attackRangeGraphics.lineStyle(1, 0x3498db, 0.2);
        this.attackRangeGraphics.strokeCircle(this.player.x, this.player.y, this.player.pickupRange);
    }

    handleAutoFire() {
        if (this.player.fireCooldown > 0) return;
        const nearest = this.findNearestEnemy();
        if (nearest) {
            this.fireProjectiles(nearest);
            this.player.fireCooldown = this.player.fireRate;
            this.player.isSwinging = true;
            this.player.swingTimer = 150;
            this.playSound('swing');
        }
    }

    findNearestEnemy() {
        let nearest = null, nearestDist = this.player.attackRange;
        this.enemies.getChildren().forEach(e => {
            if (!e.active) return;
            const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, e.x, e.y);
            if (d < nearestDist) { nearestDist = d; nearest = e; }
        });
        return nearest;
    }

    fireProjectiles(target) {
        const count = this.player.projectileCount;
        const baseAngle = Phaser.Math.Angle.Between(this.player.x, this.player.y, target.x, target.y);
        for (let i = 0; i < count; i++) {
            let angle = baseAngle;
            if (count > 1) angle += (i - (count - 1) / 2) * (Math.PI / 8);
            this.createProjectile(this.player.x, this.player.y, angle);
        }
    }

    createProjectile(x, y, angle) {
        const p = this.add.graphics();
        p.x = x; p.y = y;
        p.direction = angle;
        p.speed = this.player.projectileSpeed;
        p.damage = this.player.damage;
        p.fillStyle(0xf39c12, 1);
        p.fillCircle(0, 0, 6);
        p.fillStyle(0xffffff, 0.8);
        p.fillCircle(-2, -2, 2);
        this.projectiles.add(p);
    }

    updateProjectiles(delta) {
        const dt = delta / 1000;
        const w = this.cameras.main.width, h = this.cameras.main.height;

        this.projectiles.getChildren().forEach(p => {
            if (!p.active) return;
            p.x += Math.cos(p.direction) * p.speed * dt;
            p.y += Math.sin(p.direction) * p.speed * dt;
            if (p.x < -50 || p.x > w + 50 || p.y < -50 || p.y > h + 50) p.destroy();
        });

        this.enemyProjectiles.getChildren().forEach(p => {
            if (!p.active) return;
            p.x += Math.cos(p.direction) * p.speed * dt;
            p.y += Math.sin(p.direction) * p.speed * dt;
            if (p.x < -50 || p.x > w + 50 || p.y < -50 || p.y > h + 50) p.destroy();
        });
    }

    handleWaveSystem(delta) {
        if (!this.isRestTime) {
            if (this.stats.wave % GAME_CONSTANTS.WAVE.BOSS_WAVE_INTERVAL === 0 && !this.bossSpawned && this.waveTimer >= GAME_CONSTANTS.WAVE.DURATION / 2) {
                this.spawnBoss();
                this.bossSpawned = true;
            }
            if (this.waveTimer >= GAME_CONSTANTS.WAVE.DURATION) this.startRestTime();
        } else {
            if (this.waveTimer >= GAME_CONSTANTS.WAVE.REST_TIME) this.startNextWave();
        }

        this.spawnTimer -= delta;
        if (this.spawnTimer <= 0 && !this.isRestTime) {
            this.spawnEnemy();
            this.spawnTimer = Math.max(GAME_CONSTANTS.WAVE.MIN_SPAWN_INTERVAL, GAME_CONSTANTS.WAVE.BASE_SPAWN_INTERVAL - (this.stats.wave - 1) * 50);
        }
    }

    startRestTime() {
        this.isRestTime = true;
        this.waveTimer = 0;
        this.uiScene.showWaveMessage('波次結束！休息時間', 0x2ecc71);
    }

    startNextWave() {
        this.stats.wave++;
        this.isRestTime = false;
        this.waveTimer = 0;
        this.bossSpawned = false;
        if (this.stats.wave % GAME_CONSTANTS.WAVE.HP_INCREASE_WAVE === 1) this.hpMultiplier *= GAME_CONSTANTS.WAVE.HP_MULTIPLIER;

        const isBossWave = this.stats.wave % GAME_CONSTANTS.WAVE.BOSS_WAVE_INTERVAL === 0;
        this.uiScene.showWaveMessage(isBossWave ? 'BOSS 波！第 ' + this.stats.wave + ' 波' : '第 ' + this.stats.wave + ' 波開始！', isBossWave ? 0xe74c3c : 0xe67e22);
    }

    spawnEnemy() {
        const w = this.cameras.main.width, h = this.cameras.main.height;
        let x, y;
        const side = Phaser.Math.Between(0, 3);
        if (side === 0) { x = Phaser.Math.Between(0, w); y = -30; }
        else if (side === 1) { x = w + 30; y = Phaser.Math.Between(0, h); }
        else if (side === 2) { x = Phaser.Math.Between(0, w); y = h + 30; }
        else { x = -30; y = Phaser.Math.Between(0, h); }
        this.createEnemy(x, y, this.getRandomEnemyType());
    }

    getRandomEnemyType() {
        const types = ['NORMAL'], weights = [100];
        if (this.gameTime >= 30000) { types.push('FAST'); weights.push(30); }
        if (this.gameTime >= 45000) { types.push('RANGED'); weights.push(20); }
        if (this.gameTime >= 60000) { types.push('TANK'); weights.push(25); }
        const total = weights.reduce((a, b) => a + b, 0);
        let rand = Phaser.Math.Between(1, total);
        for (let i = 0; i < types.length; i++) { rand -= weights[i]; if (rand <= 0) return types[i]; }
        return 'NORMAL';
    }

    createEnemy(x, y, type) {
        const cfg = GAME_CONSTANTS.ENEMY[type];
        const enemy = this.add.container(x, y);
        Object.assign(enemy, {
            type, hp: cfg.hp * this.hpMultiplier, maxHp: cfg.hp * this.hpMultiplier,
            speed: typeof cfg.speed === 'object' ? Phaser.Math.Between(cfg.speed.min, cfg.speed.max) : cfg.speed,
            damage: cfg.damage, exp: cfg.exp, radius: cfg.radius,
            shootTimer: 0, shootInterval: cfg.shootInterval || 0
        });

        const g = this.add.graphics();
        this.drawEnemyBody(g, type, enemy.radius);
        enemy.add(g);

        if (type === 'TANK' || type === 'BOSS') {
            enemy.hpBarBg = this.add.graphics();
            enemy.hpBar = this.add.graphics();
            enemy.add(enemy.hpBarBg);
            enemy.add(enemy.hpBar);
        }

        this.enemies.add(enemy);
    }

    drawEnemyBody(g, type, r) {
        g.clear();
        if (type === 'NORMAL') {
            g.fillStyle(0xe74c3c, 1);
            g.fillCircle(0, 0, r);
            g.fillStyle(0xffffff, 1);
            g.fillCircle(-5, -3, 4);
            g.fillCircle(5, -3, 4);
            g.fillStyle(0x2c3e50, 1);
            g.fillCircle(-4, -2, 2);
            g.fillCircle(6, -2, 2);
        } else if (type === 'FAST') {
            g.fillStyle(0x27ae60, 1);
            g.fillCircle(0, 0, r);
            g.fillStyle(0x1e8449, 1);
            g.fillTriangle(-4, -r, 0, -r - 8, 4, -r);
            g.fillStyle(0xffffff, 1);
            g.fillCircle(-3, -2, 3);
            g.fillCircle(3, -2, 3);
        } else if (type === 'TANK') {
            g.fillStyle(0x7f8c8d, 1);
            g.fillCircle(0, 0, r);
            g.lineStyle(3, 0x95a5a6, 1);
            g.strokeCircle(0, 0, r - 2);
            g.fillStyle(0xe74c3c, 1);
            g.fillCircle(-6, -4, 5);
            g.fillCircle(6, -4, 5);
        } else if (type === 'RANGED') {
            g.fillStyle(0x9b59b6, 1);
            g.fillCircle(0, 0, r);
            g.fillStyle(0x8e44ad, 1);
            g.fillCircle(0, -r + 3, 4);
            g.fillStyle(0xf1c40f, 1);
            g.fillCircle(-4, -2, 3);
            g.fillCircle(4, -2, 3);
        } else if (type === 'BOSS') {
            g.fillStyle(0xc0392b, 1);
            g.fillCircle(0, 0, r);
            g.fillStyle(0xf1c40f, 1);
            g.fillTriangle(-12, -r, -6, -r - 12, 0, -r);
            g.fillTriangle(0, -r, 6, -r - 12, 12, -r);
            g.lineStyle(4, 0xe74c3c, 0.5);
            g.strokeCircle(0, 0, r + 4);
            g.fillStyle(0xf1c40f, 1);
            g.fillCircle(-8, -5, 6);
            g.fillCircle(8, -5, 6);
        }
    }

    updateEnemyHealthBar(enemy) {
        if (!enemy.hpBar) return;
        const w = enemy.radius * 2, y = -enemy.radius - 10;
        enemy.hpBarBg.clear();
        enemy.hpBarBg.fillStyle(0x2c3e50, 1);
        enemy.hpBarBg.fillRect(-w/2, y, w, 4);
        enemy.hpBar.clear();
        enemy.hpBar.fillStyle(0xe74c3c, 1);
        enemy.hpBar.fillRect(-w/2, y, w * (enemy.hp / enemy.maxHp), 4);
    }

    spawnBoss() {
        const w = this.cameras.main.width, h = this.cameras.main.height;
        let x, y;
        const side = Phaser.Math.Between(0, 3);
        if (side === 0) { x = Phaser.Math.Between(100, w - 100); y = -50; }
        else if (side === 1) { x = w + 50; y = Phaser.Math.Between(100, h - 100); }
        else if (side === 2) { x = Phaser.Math.Between(100, w - 100); y = h + 50; }
        else { x = -50; y = Phaser.Math.Between(100, h - 100); }
        this.createEnemy(x, y, 'BOSS');
    }

    updateEnemies(delta) {
        const dt = delta / 1000;
        this.enemies.getChildren().forEach(e => {
            if (!e.active) return;
            const angle = Phaser.Math.Angle.Between(e.x, e.y, this.player.x, this.player.y);
            e.x += Math.cos(angle) * e.speed * dt;
            e.y += Math.sin(angle) * e.speed * dt;

            if ((e.type === 'RANGED' || e.type === 'BOSS') && e.shootInterval > 0) {
                e.shootTimer += delta;
                if (e.shootTimer >= e.shootInterval) { e.shootTimer = 0; this.createEnemyProjectile(e); }
            }

            if (e.type === 'TANK' || e.type === 'BOSS') this.updateEnemyHealthBar(e);
        });
    }

    createEnemyProjectile(enemy) {
        const p = this.add.graphics();
        p.x = enemy.x; p.y = enemy.y;
        p.direction = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
        p.speed = 200; p.damage = 5;
        p.fillStyle(0x9b59b6, 1);
        p.fillCircle(0, 0, 5);
        this.enemyProjectiles.add(p);
    }

    handleCollisions() {
        // Projectiles vs enemies
        this.projectiles.getChildren().forEach(p => {
            if (!p.active) return;
            this.enemies.getChildren().forEach(e => {
                if (!e.active) return;
                if (Phaser.Math.Distance.Between(p.x, p.y, e.x, e.y) < e.radius + 6) {
                    this.damageEnemy(e, p.damage);
                    p.destroy();
                    this.playSound('hit');
                }
            });
        });

        // Enemy projectiles vs player
        this.enemyProjectiles.getChildren().forEach(p => {
            if (!p.active) return;
            if (Phaser.Math.Distance.Between(p.x, p.y, this.player.x, this.player.y) < 20) {
                this.damagePlayer(p.damage);
                p.destroy();
            }
        });

        // Enemies vs player
        this.enemies.getChildren().forEach(e => {
            if (!e.active) return;
            if (Phaser.Math.Distance.Between(e.x, e.y, this.player.x, this.player.y) < e.radius + 15) {
                this.damagePlayer(e.damage);
            }
        });

        // Exp orbs vs player
        this.expOrbs.getChildren().forEach(orb => {
            if (!orb.active) return;
            const d = Phaser.Math.Distance.Between(orb.x, orb.y, this.player.x, this.player.y);
            if (d < this.player.pickupRange) {
                const a = Phaser.Math.Angle.Between(orb.x, orb.y, this.player.x, this.player.y);
                orb.x += Math.cos(a) * 8;
                orb.y += Math.sin(a) * 8;
            }
            if (d < 15) {
                this.collectExp(orb.value);
                orb.destroy();
                this.playSound('pickup');
            }
        });
    }

    damageEnemy(enemy, damage) {
        enemy.hp -= damage;
        this.showDamageNumber(enemy.x, enemy.y, damage);
        if (enemy.hp <= 0) this.killEnemy(enemy);
    }

    killEnemy(enemy) {
        this.createExplosion(enemy.x, enemy.y);
        this.createExpOrb(enemy.x, enemy.y, enemy.exp);
        this.stats.kills++;
        if (enemy.type === 'BOSS') this.stats.bossKills++;
        this.checkChainKill(enemy);
        this.playSound('kill');
        enemy.destroy();
    }

    checkChainKill(killed) {
        let chains = 0;
        this.enemies.getChildren().forEach(e => {
            if (!e.active || e === killed) return;
            if (Phaser.Math.Distance.Between(killed.x, killed.y, e.x, e.y) < GAME_CONSTANTS.CHAIN_KILL.RANGE) {
                chains++;
                e.hp = 0;
                this.killEnemy(e);
            }
        });
        if (chains > 0) this.triggerChainKillBuff(chains + 1);
    }

    triggerChainKillBuff(count) {
        this.hasChainKillBuff = true;
        this.chainKillBuffTimer = GAME_CONSTANTS.CHAIN_KILL.BUFF_DURATION;
        this.showChainKillDisplay(count);
        this.uiScene.showBuffNotification('⚡ 連殺！攻擊速度 +30%', GAME_CONSTANTS.CHAIN_KILL.BUFF_DURATION);
        this.playSound('chainKill');
    }

    showChainKillDisplay(count) {
        let text, color;
        if (count >= 10) { text = 'GODLIKE!'; color = '#6c3483'; }
        else if (count >= 6) { text = 'ULTRA KILL!'; color = '#8e44ad'; }
        else if (count >= 5) { text = 'MEGA KILL!'; color = '#c0392b'; }
        else if (count >= 4) { text = 'QUAD KILL!'; color = '#e74c3c'; }
        else if (count >= 3) { text = 'TRIPLE KILL!'; color = '#e67e22'; }
        else { text = 'DOUBLE KILL!'; color = '#f1c40f'; }

        const t = this.add.text(this.player.x, this.player.y - 50, text, {
            fontSize: '32px', fontFamily: 'Arial Black', color: color, stroke: '#000', strokeThickness: 4
        }).setOrigin(0.5);

        this.tweens.add({ targets: t, y: t.y - 30, alpha: 0, scale: { from: 1.2, to: 2.5 }, duration: 1500, onComplete: () => t.destroy() });
    }

    handleChainKill(delta) {
        if (this.hasChainKillBuff) {
            this.chainKillBuffTimer -= delta;
            if (this.chainKillBuffTimer <= 0) this.hasChainKillBuff = false;
        }
    }

    createExplosion(x, y) {
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const speed = Phaser.Math.Between(80, 140);
            const p = this.add.graphics();
            p.fillStyle(Phaser.Math.RND.pick([0xe74c3c, 0xf39c12]), 1);
            p.fillCircle(0, 0, Phaser.Math.Between(3, 5));
            p.x = x; p.y = y;
            this.tweens.add({
                targets: p,
                x: x + Math.cos(angle) * speed * 0.5,
                y: y + Math.sin(angle) * speed * 0.5,
                alpha: 0, scale: 0.5, duration: 500, onComplete: () => p.destroy()
            });
        }

        const flash = this.add.graphics();
        flash.fillStyle(0xffffff, 1);
        flash.fillCircle(x, y, 10);
        this.tweens.add({ targets: flash, alpha: 0, scale: 3, duration: 200, onComplete: () => flash.destroy() });
    }

    createExpOrb(x, y, value) {
        const orb = this.add.graphics();
        orb.fillStyle(0x2ecc71, 1);
        orb.fillCircle(0, 0, 8);
        orb.fillStyle(0xffffff, 0.7);
        orb.fillCircle(-2, -2, 3);
        orb.x = x; orb.y = y;
        orb.value = value;
        this.tweens.add({ targets: orb, scale: { from: 1, to: 1.2 }, duration: 300, yoyo: true, repeat: -1 });
        this.expOrbs.add(orb);
    }

    collectExp(value) {
        this.stats.exp += value;
        if (this.stats.exp >= GAME_CONSTANTS.EXP_TO_LEVEL(this.stats.level)) this.levelUp();
        this.updateUI();
    }

    levelUp() {
        this.stats.exp -= GAME_CONSTANTS.EXP_TO_LEVEL(this.stats.level);
        this.stats.level++;
        this.isLevelUp = true;
        this.playSound('levelUp');
        this.showTalentSelection();
    }

    showTalentSelection() {
        const shuffled = [...GAME_CONSTANTS.TALENTS].sort(() => Math.random() - 0.5);
        const options = shuffled.slice(0, 3);
        this.uiScene.showLevelUpPanel(options, (talent) => {
            this.applyTalent(talent);
            this.isLevelUp = false;
        });
    }

    applyTalent(talent) {
        const e = talent.effect;
        if (e.hp) { this.player.maxHp += e.hp; this.player.hp += e.hp; }
        if (e.speed) this.player.speed += e.speed;
        if (e.pickupRange) this.player.pickupRange += e.pickupRange;
        if (e.attackRange) this.player.attackRange += e.attackRange;
        if (e.fireRate) this.player.fireRate = Math.max(100, this.player.fireRate + e.fireRate);
        if (e.damage) this.player.damage += e.damage;
        if (e.projectileSpeed) this.player.projectileSpeed += e.projectileSpeed;
        if (e.projectileCount) this.player.projectileCount += e.projectileCount;
        this.updateUI();
    }

    showDamageNumber(x, y, damage) {
        const size = Math.min(16 + damage * 2, 36);
        const color = damage >= 5 ? '#f1c40f' : '#ffffff';
        const t = this.add.text(x, y, damage.toString(), {
            fontSize: size + 'px', fontFamily: 'Arial', color: color, stroke: '#000', strokeThickness: 2
        }).setOrigin(0.5);
        this.tweens.add({ targets: t, y: y - 30, alpha: 0, scale: { from: 1, to: 1.5 }, duration: 800, onComplete: () => t.destroy() });
    }

    damagePlayer(damage) {
        if (this.player.isInvincible) return;
        this.player.hp -= damage;
        this.player.isInvincible = true;
        this.player.invincibleTimer = GAME_CONSTANTS.PLAYER.INVINCIBLE_TIME;
        this.player.setAlpha(0.5);
        this.tweens.add({ targets: this.player, alpha: 1, duration: 100, yoyo: true, repeat: 5 });
        this.playSound('damage');
        this.updateUI();
        if (this.player.hp <= 0) this.gameOver();
    }

    gameOver() {
        this.isGameOver = true;
        this.stopBGM();
        this.playSound('gameOver');
        const stats = {
            level: this.stats.level, kills: this.stats.kills,
            bossKills: this.stats.bossKills, wave: this.stats.wave,
            time: Math.floor(this.gameTime / 1000)
        };
        this.uiScene.showGameOver(stats);
    }

    togglePause() {
        if (this.isLevelUp || this.isGameOver) return;
        this.isPaused = !this.isPaused;
        if (this.isPaused) this.uiScene.showPauseScreen();
        else this.uiScene.hidePauseScreen();
    }

    updateUI() {
        if (this.uiScene && this.uiScene.hpBar) {
            this.uiScene.updateStats({
                hp: this.player.hp, maxHp: this.player.maxHp,
                level: this.stats.level, exp: this.stats.exp,
                expNeeded: GAME_CONSTANTS.EXP_TO_LEVEL(this.stats.level),
                kills: this.stats.kills, wave: this.stats.wave,
                gameTime: this.gameTime, isRestTime: this.isRestTime
            });
        }
    }
}

// ==================== UI SCENE ====================
class UIScene extends Phaser.Scene {
    constructor() { super({ key: 'UIScene' }); }

    create() {
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;

        this.statsBg = this.add.graphics();
        this.statsBg.fillStyle(0x1a1a2e, 0.8);
        this.statsBg.fillRect(10, 10, 220, 80);

        this.hpBarBg = this.add.graphics();
        this.hpBarBg.fillStyle(0x2c3e50, 1);
        this.hpBarBg.fillRect(20, 20, 200, 20);

        this.hpBar = this.add.graphics();
        this.hpText = this.add.text(120, 30, '100 / 100', { fontSize: '12px', fontFamily: 'Arial', color: '#fff' }).setOrigin(0.5);

        this.expBarBg = this.add.graphics();
        this.expBarBg.fillStyle(0x34495e, 1);
        this.expBarBg.fillRect(20, 45, 200, 15);

        this.expBar = this.add.graphics();
        this.expText = this.add.text(120, 52, '0 / 20', { fontSize: '10px', fontFamily: 'Arial', color: '#fff' }).setOrigin(0.5);

        this.levelText = this.add.text(20, 65, 'Lv. 1', { fontSize: '16px', fontFamily: 'Arial', color: '#f1c40f', fontStyle: 'bold' });

        this.timerText = this.add.text(w - 20, 20, '00:00', { fontSize: '24px', fontFamily: 'Arial', color: '#fff' }).setOrigin(1, 0);

        this.waveText = this.add.text(20, h - 40, '波次: 1', { fontSize: '18px', fontFamily: 'Arial', color: '#fff' });

        this.killsText = this.add.text(w - 20, h - 40, '擊殺: 0', { fontSize: '18px', fontFamily: 'Arial', color: '#fff' }).setOrigin(1, 0);

        this.waveMessageContainer = this.add.container(w / 2, 150);
        this.waveMessageContainer.setAlpha(0);

        this.buffContainer = this.add.container(w / 2, 140);
        this.buffContainer.setAlpha(0);

        this.pauseContainer = this.createPauseScreen(w, h);
        this.pauseContainer.setVisible(false);

        this.levelUpContainer = this.add.container(w / 2, h / 2);
        this.levelUpContainer.setVisible(false);

        this.gameOverContainer = this.add.container(w / 2, h / 2);
        this.gameOverContainer.setVisible(false);

        this.loadStats();
    }

    loadStats() {
        try {
            const saved = localStorage.getItem('survivor_js_stats');
            this.savedStats = saved ? JSON.parse(saved) : { highestLevel: 0, longestTime: 0, totalKills: 0, highestWave: 0, totalGames: 0, bossesKilled: 0 };
        } catch (e) {
            this.savedStats = { highestLevel: 0, longestTime: 0, totalKills: 0, highestWave: 0, totalGames: 0, bossesKilled: 0 };
        }
    }

    saveStats(newStats) {
        try {
            this.savedStats.highestLevel = Math.max(this.savedStats.highestLevel, newStats.level);
            this.savedStats.longestTime = Math.max(this.savedStats.longestTime, newStats.time);
            this.savedStats.totalKills += newStats.kills;
            this.savedStats.highestWave = Math.max(this.savedStats.highestWave, newStats.wave);
            this.savedStats.totalGames++;
            this.savedStats.bossesKilled += newStats.bossKills;
            localStorage.setItem('survivor_js_stats', JSON.stringify(this.savedStats));
        } catch (e) { console.warn('Failed to save stats'); }
    }

    updateStats(stats) {
        if (!this.hpBar) return;
        this.hpBar.clear();
        this.hpBar.fillStyle(0xe74c3c, 1);
        this.hpBar.fillRect(20, 20, 200 * Math.max(0, stats.hp / stats.maxHp), 20);
        this.hpText.setText(Math.max(0, Math.floor(stats.hp)) + ' / ' + stats.maxHp);

        this.expBar.clear();
        this.expBar.fillStyle(0xe67e22, 1);
        this.expBar.fillRect(20, 45, 200 * (stats.exp / stats.expNeeded), 15);
        this.expText.setText(stats.exp + ' / ' + stats.expNeeded);

        this.levelText.setText('Lv. ' + stats.level);

        const mins = Math.floor(stats.gameTime / 60000);
        const secs = Math.floor((stats.gameTime % 60000) / 1000);
        this.timerText.setText(mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0'));

        let waveText = '波次: ' + stats.wave;
        if (stats.wave % 5 === 0) waveText = 'BOSS 波！';
        if (stats.isRestTime) waveText += ' (休息)';
        this.waveText.setText(waveText);

        this.killsText.setText('擊殺: ' + stats.kills);
    }

    showWaveMessage(text, color) {
        this.waveMessageContainer.removeAll(true);
        this.waveMessageContainer.setAlpha(1);

        const bg = this.add.graphics();
        bg.fillStyle(color, 0.8);
        bg.fillRoundedRect(-120, -25, 240, 50, 10);
        this.waveMessageContainer.add(bg);

        const msg = this.add.text(0, 0, text, { fontSize: '24px', fontFamily: 'Arial Black', color: '#fff', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5);
        this.waveMessageContainer.add(msg);

        this.tweens.add({ targets: this.waveMessageContainer, alpha: 0, delay: 2000, duration: 500 });
    }

    showBuffNotification(text, duration) {
        this.buffContainer.removeAll(true);
        this.buffContainer.setAlpha(1);

        const bg = this.add.graphics();
        bg.fillStyle(0x27ae60, 0.9);
        bg.fillRoundedRect(-100, -20, 200, 40, 8);
        bg.lineStyle(2, 0xffffff, 1);
        bg.strokeRoundedRect(-100, -20, 200, 40, 8);
        this.buffContainer.add(bg);

        const msg = this.add.text(0, 0, text, { fontSize: '14px', fontFamily: 'Arial', color: '#fff' }).setOrigin(0.5);
        this.buffContainer.add(msg);

        const progressBg = this.add.graphics();
        progressBg.fillStyle(0x1e8449, 1);
        progressBg.fillRect(-95, 12, 190, 5);
        this.buffContainer.add(progressBg);

        const progressBar = this.add.graphics();
        this.buffContainer.add(progressBar);

        this.buffContainer.y = 100;
        this.tweens.add({ targets: this.buffContainer, y: 140, duration: 300, ease: 'Back.easeOut' });

        this.tweens.add({
            targets: { progress: 1 }, progress: 0, duration: duration,
            onUpdate: (tween) => {
                progressBar.clear();
                progressBar.fillStyle(0x2ecc71, 1);
                progressBar.fillRect(-95, 12, 190 * tween.targets[0].progress, 5);
            },
            onComplete: () => { this.tweens.add({ targets: this.buffContainer, alpha: 0, duration: 300 }); }
        });
    }

    createPauseScreen(w, h) {
        const container = this.add.container(w / 2, h / 2);

        const overlay = this.add.graphics();
        overlay.fillStyle(0x000000, 0.7);
        overlay.fillRect(-w/2, -h/2, w, h);
        container.add(overlay);

        const panel = this.add.graphics();
        panel.fillStyle(0x2c3e50, 0.95);
        panel.fillRoundedRect(-150, -100, 300, 200, 15);
        panel.lineStyle(3, 0x3498db, 1);
        panel.strokeRoundedRect(-150, -100, 300, 200, 15);
        container.add(panel);

        container.add(this.add.text(0, -60, '遊戲暫停', { fontSize: '32px', fontFamily: 'Arial Black', color: '#fff' }).setOrigin(0.5));
        container.add(this.add.text(0, 20, '按 ESC 或 P 繼續遊戲', { fontSize: '16px', fontFamily: 'Arial', color: '#bdc3c7' }).setOrigin(0.5));
        container.add(this.add.text(0, 60, 'WASD / 方向鍵：移動', { fontSize: '14px', fontFamily: 'Arial', color: '#95a5a6' }).setOrigin(0.5));

        return container;
    }

    showPauseScreen() { this.pauseContainer.setVisible(true); }
    hidePauseScreen() { this.pauseContainer.setVisible(false); }

    showLevelUpPanel(options, callback) {
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;

        this.levelUpContainer.removeAll(true);
        this.levelUpContainer.setVisible(true);

        const overlay = this.add.graphics();
        overlay.fillStyle(0x000000, 0.7);
        overlay.fillRect(-w/2, -h/2, w, h);
        this.levelUpContainer.add(overlay);

        const panel = this.add.graphics();
        panel.fillStyle(0x2c3e50, 0.95);
        panel.fillRoundedRect(-250, -180, 500, 360, 15);
        this.levelUpContainer.add(panel);

        this.levelUpContainer.add(this.add.text(0, -140, '升級！選擇一項強化', { fontSize: '28px', fontFamily: 'Arial Black', color: '#f1c40f' }).setOrigin(0.5));

        const cardWidth = 140;
        const startX = -cardWidth - 10;

        options.forEach((talent, index) => {
            const cardX = startX + index * (cardWidth + 20);
            this.createTalentCard(cardX, -30, talent, callback);
        });
    }

    createTalentCard(x, y, talent, callback) {
        // Card background graphics
        const cardBg = this.add.graphics();
        cardBg.fillStyle(0x2980b9, 1);
        cardBg.fillRoundedRect(x - 65, y - 100, 130, 200, 10);
        cardBg.lineStyle(2, 0x3498db, 1);
        cardBg.strokeRoundedRect(x - 65, y - 100, 130, 200, 10);

        // Icon
        const icon = this.add.text(x, y - 50, talent.icon, { fontSize: '48px' }).setOrigin(0.5);

        // Name
        const name = this.add.text(x, y + 20, talent.name, { fontSize: '16px', fontFamily: 'Arial', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        // Description
        const desc = this.add.text(x, y + 50, talent.desc, { fontSize: '12px', fontFamily: 'Arial', color: '#bdc3c7', wordWrap: { width: 120 }, align: 'center' }).setOrigin(0.5);

        // Interactive zone (using Rectangle for proper hit area)
        const hitZone = this.add.rectangle(x, y, 130, 200, 0x000000, 0);
        hitZone.setInteractive({ useHandCursor: true });

        hitZone.on('pointerover', () => {
            cardBg.clear();
            cardBg.fillStyle(0x3498db, 1);
            cardBg.fillRoundedRect(x - 65, y - 100, 130, 200, 10);
            cardBg.lineStyle(3, 0xf1c40f, 1);
            cardBg.strokeRoundedRect(x - 65, y - 100, 130, 200, 10);
        });

        hitZone.on('pointerout', () => {
            cardBg.clear();
            cardBg.fillStyle(0x2980b9, 1);
            cardBg.fillRoundedRect(x - 65, y - 100, 130, 200, 10);
            cardBg.lineStyle(2, 0x3498db, 1);
            cardBg.strokeRoundedRect(x - 65, y - 100, 130, 200, 10);
        });

        hitZone.on('pointerdown', () => {
            this.levelUpContainer.setVisible(false);
            callback(talent);
        });

        this.levelUpContainer.add(cardBg);
        this.levelUpContainer.add(icon);
        this.levelUpContainer.add(name);
        this.levelUpContainer.add(desc);
        this.levelUpContainer.add(hitZone);
    }

    showGameOver(stats) {
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;

        this.gameOverContainer.removeAll(true);
        this.gameOverContainer.setVisible(true);

        this.saveStats(stats);

        const overlay = this.add.graphics();
        overlay.fillStyle(0x000000, 0.85);
        overlay.fillRect(-w/2, -h/2, w, h);
        this.gameOverContainer.add(overlay);

        const panel = this.add.graphics();
        panel.fillStyle(0x1a1a2e, 0.95);
        panel.fillRoundedRect(-200, -280, 400, 560, 15);
        panel.lineStyle(3, 0xe74c3c, 1);
        panel.strokeRoundedRect(-200, -280, 400, 560, 15);
        this.gameOverContainer.add(panel);

        this.gameOverContainer.add(this.add.text(0, -240, '遊戲結束', { fontSize: '36px', fontFamily: 'Arial Black', color: '#e74c3c' }).setOrigin(0.5));
        this.gameOverContainer.add(this.add.text(0, -180, '本次成績', { fontSize: '20px', fontFamily: 'Arial', color: '#f1c40f' }).setOrigin(0.5));

        const isNewLevel = stats.level > this.savedStats.highestLevel;
        const isNewWave = stats.wave > this.savedStats.highestWave;
        const isNewTime = stats.time > this.savedStats.longestTime;

        const currentStats = [
            { label: '等級', value: stats.level + (isNewLevel ? ' 🏆' : '') },
            { label: '擊殺數', value: stats.kills },
            { label: 'Boss擊殺', value: stats.bossKills },
            { label: '最高波次', value: stats.wave + (isNewWave ? ' 🏆' : '') },
            { label: '存活時間', value: this.formatTime(stats.time) + (isNewTime ? ' 🏆' : '') }
        ];

        currentStats.forEach((stat, i) => {
            this.gameOverContainer.add(this.add.text(-150, -140 + i * 30, stat.label + ':', { fontSize: '16px', fontFamily: 'Arial', color: '#bdc3c7' }));
            this.gameOverContainer.add(this.add.text(150, -140 + i * 30, String(stat.value), { fontSize: '16px', fontFamily: 'Arial', color: '#fff' }).setOrigin(1, 0));
        });

        this.gameOverContainer.add(this.add.text(0, 30, '歷史紀錄', { fontSize: '20px', fontFamily: 'Arial', color: '#3498db' }).setOrigin(0.5));

        const histStats = [
            { label: '最高等級', value: this.savedStats.highestLevel },
            { label: '最長存活', value: this.formatTime(this.savedStats.longestTime) },
            { label: '總擊殺數', value: this.savedStats.totalKills },
            { label: '最高波次', value: this.savedStats.highestWave },
            { label: 'Boss擊殺總數', value: this.savedStats.bossesKilled },
            { label: '總遊戲次數', value: this.savedStats.totalGames }
        ];

        histStats.forEach((stat, i) => {
            this.gameOverContainer.add(this.add.text(-150, 70 + i * 25, stat.label + ':', { fontSize: '14px', fontFamily: 'Arial', color: '#7f8c8d' }));
            this.gameOverContainer.add(this.add.text(150, 70 + i * 25, String(stat.value), { fontSize: '14px', fontFamily: 'Arial', color: '#bdc3c7' }).setOrigin(1, 0));
        });

        const buttonBg = this.add.graphics();
        buttonBg.fillStyle(0x27ae60, 1);
        buttonBg.fillRoundedRect(-80, 230, 160, 40, 8);
        this.gameOverContainer.add(buttonBg);

        this.gameOverContainer.add(this.add.text(0, 250, '重新開始', { fontSize: '18px', fontFamily: 'Arial', color: '#fff' }).setOrigin(0.5));

        const restartZone = this.add.rectangle(0, 250, 160, 40, 0x000000, 0);
        restartZone.setInteractive({ useHandCursor: true });

        restartZone.on('pointerover', () => {
            buttonBg.clear();
            buttonBg.fillStyle(0x2ecc71, 1);
            buttonBg.fillRoundedRect(-80, 230, 160, 40, 8);
        });

        restartZone.on('pointerout', () => {
            buttonBg.clear();
            buttonBg.fillStyle(0x27ae60, 1);
            buttonBg.fillRoundedRect(-80, 230, 160, 40, 8);
        });

        restartZone.on('pointerdown', () => {
            this.scene.get('GameScene').scene.restart();
            this.scene.restart();
        });

        this.gameOverContainer.add(restartZone);
    }

    formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return mins + '分' + secs + '秒';
    }
}

// ==================== GAME CONFIG ====================
const config = {
    type: Phaser.AUTO,
    width: 1280,
    height: 720,
    parent: 'game-container',
    backgroundColor: '#2d3436',
    physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
    scene: [BootScene, GameScene, UIScene]
};

const game = new Phaser.Game(config);
window.game = game;
    </script>
